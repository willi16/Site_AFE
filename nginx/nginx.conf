# Configuration Nginx sécurisée et robuste pour le site AFE.

# Zones de limitation pour se protéger du DDoS et des abus.
# - "conn" : nombre maximal de connexions simultanées par adresse IP.
# - "req"  : nombre de requêtes par minute et par adresse IP (global).
# - "auth" : limitation renforcée sur les routes de connexion / formulaires.
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_zone $binary_remote_addr zone=req:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Taille maximale d'un envoi (upload) : 12 Mo.
    client_max_body_size 12m;

    # Limites de connexion et de débit.
    limit_conn conn 20;
    limit_req zone=req burst=120 nodelay;

    # En-têtes de sécurité.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache des fichiers statiques (le site construit).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # Limitation renforcée sur les routes sensibles
        if ($request_uri ~* "^/api/auth/token|^/api/auth/token/refresh") {
            limit_req zone=auth burst=3 nodelay;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /media/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
